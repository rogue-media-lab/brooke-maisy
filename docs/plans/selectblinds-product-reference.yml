  - name: Cordless Blackout Cellular Shades
    category: Cellular Shades
    subcategory: Blackout
    product_url: https://www.selectblinds.com/products/cordless-blackout-cellular-shades
    base_price: 117.99
    unit: per window
    rating: 4.6
    review_count: 1762

    description: |
      Enhance your living space with Cordless Blackout Cellular Shades from
      Select Blinds, the perfect solution for creating a peaceful, energy-efficient
      environment. These cellular blinds blackout styles block out light completely,
      making them ideal for bedrooms, nurseries, or media rooms. Designed with a
      cordless lift system, they combine safety, convenience, and sleek modern style.

    features:
      - "Light Control & Privacy: Blocks 99% of light, maximum privacy"
      - "Energy Savings: 3/4\" honeycomb design enhances insulation"
      - "Modern, Cordless Design: Clean, clutter-free look"
      - "Durable & Easy to Maintain: High-quality materials, easy to clean"

    specs:
      type: cellular
      cell_size: '3/4" honeycomb'
      min_width: 13
      max_width: 84
      min_height: 12
      max_height: 84
      width_increment: '1/8"'
      height_increment: '1/8"'
      mount_types: [inside, outside]
      lift_styles:
        - { name: cordless, upcharge: 0 }
        - { name: motorized_wand, upcharge: 87.17 }
        - { name: automation, upcharge: 121.18 }
      upgrades:
        - { name: no_drill_click2fit, upcharge: 28.00 }
        - { name: automation_extension_cable, upcharge: 7.81, requires: automation }
        - { name: automation_bridge, upcharge: 155.78, requires: automation }
      warranty_options:
        - { name: "3_year_limited", upcharge: 0 }
        - { name: "5_year_limited", upcharge: 9.43 }
        - { name: "5_year_unlimited", upcharge: 18.87 }
      constraints:
        cordless: { min_inside_depth: 1.25, flush_depth: 2.25 }
        motorized: { max_sqft: 24 }
      headrail_depths:
        cordless: 1.875
        cord_loop: 2.125

    colors:
